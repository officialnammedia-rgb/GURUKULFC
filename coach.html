<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to Gurukul FC Coach Portal...</title>
  <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbxX5BUYfTEyxT1Q6u_oNhCihi3YNL2BTxiI7FGnhozZwRKlgVOYEI1zgUmVNp_Ike2GeA/exec" />
  <script>
    window.location.replace("https://script.google.com/macros/s/AKfycbxX5BUYfTEyxT1Q6u_oNhCihi3YNL2BTxiI7FGnhozZwRKlgVOYEI1zgUmVNp_Ike2GeA/exec");
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap"
    rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #06090e;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .redirect-card {
      background: rgba(14, 23, 38, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(44, 158, 233, 0.3);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .logo-img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin-bottom: 6px;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(44, 158, 233, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    h1 {
      font-family: 'Bebas Neue', 'Outfit', sans-serif;
      font-size: 32px;
      letter-spacing: 0.04em;
      color: #ffffff;
    }

    p {
      font-size: 14.5px;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.5;
    }

    .direct-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #2c9ee9 0%, #1d4ed8 100%);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.03em;
      padding: 12px 24px;
      border-radius: 12px;
      margin-top: 8px;
      box-shadow: 0 6px 20px rgba(44, 158, 233, 0.4);
      transition: all 0.2s ease;
    }

    .direct-btn:hover {
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      box-shadow: 0 8px 24px rgba(44, 158, 233, 0.6);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="redirect-card">
    <img src="/assets/gurukul-logo.png" alt="Gurukul FC Logo" class="logo-img" />
    <div class="spinner"></div>
    <h1>OPENING COACH PORTAL</h1>
    <p>Redirecting you directly to the Gurukul FC Coach Application...</p>
    <a href="https://script.google.com/macros/s/AKfycbxX5BUYfTEyxT1Q6u_oNhCihi3YNL2BTxiI7FGnhozZwRKlgVOYEI1zgUmVNp_Ike2GeA/exec"
      class="direct-btn">
      <span>Click here if not redirected</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
    </a>
  </div>
</body>

</html>
